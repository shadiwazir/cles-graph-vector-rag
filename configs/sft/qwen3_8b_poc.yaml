# Proof-of-concept run on one L40S 48 GB: copy of qwen3_8b_qlora.yaml with PoC sequence length, batch and step intervals.
# Every value can be overridden by editing a copy of this file; point SFT_CONFIG at it.
name: qwen3-8b-poc
backend: unsloth            # unsloth: GPU, 4-bit. plain: transformers + peft, for smoke tests
base_model: Qwen/Qwen3-8B   # verify the licence on the model card before use (Apache 2.0 reported)
load_in_4bit: true
max_seq_length: 12288       # PoC dataset: longest example 8849 tokens, 48 of 359 exceed 8192
enable_thinking: false      # Qwen3 chat template flag: train without "thinking" blocks

lora:
  r: 64
  alpha: 128
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

epochs: 2
learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_ratio: 0.03
weight_decay: 0.0
per_device_batch_size: 1     # long sequences on a 48 GB card
grad_accum_steps: 16        # effective batch: 16 sequences
logging_steps: 5
eval_steps: 10         # about 45 steps in total (359 examples, 2 epochs)
save_steps: 20
eval_max_examples: 200
seed: 3407
bf16: true

# Used by `--dry-run` for a time and cost estimate. Measure tokens_per_second with a short pilot
# run on the rented GPU before trusting it; it varies a lot with GPU, sequence length and batch.
estimate:
  tokens_per_second: 2500   # pilot 2026-11-13: 44-52 s per 16-sequence step on L40S
  gpu_price_per_hour: 1.09   # RunPod L40S on demand, Nov 2026
