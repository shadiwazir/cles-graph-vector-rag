# Run from the repo root:  docker compose --env-file .env -f infra/docker-compose.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cles_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cles_db}
      POSTGRES_USER: ${POSTGRES_USER:-cles_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cles_admin} -d ${POSTGRES_DB:-cles_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies infra/postgres/migrations, then exits.
  flyway:
    image: flyway/flyway:11
    container_name: cles_flyway
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/migrations:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cles_db}
      -user=${POSTGRES_USER:-cles_admin}
      -password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      -connectRetries=10
      migrate

  neo4j:
    image: neo4j:5.26-community
    container_name: cles_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Only needed for training: docker compose --profile training up -d mlflow
  mlflow:
    profiles: ["training"]
    build: ./mlflow
    container_name: cles_mlflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-cles_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/mlflow
      --serve-artifacts --artifacts-destination /mlflow/artifacts
      --x-frame-options NONE

  # Telemetry stack: docker compose --profile observability up -d
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: cles_otel_collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - phoenix

  phoenix:
    profiles: ["observability"]
    image: arizephoenix/phoenix:version-20.27.0
    container_name: cles_phoenix
    # Elastic License 2.0: internal use only, never expose this UI to third parties (ADR 0007).
    # Pinned below v21: v21 turns authentication on by default in Docker; set PHOENIX_ENABLE_AUTH
    # explicitly before upgrading.
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"   # no price-table or update fetches from the internet
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "30"  # keep traces 30 days (default: forever)
    ports:
      - "127.0.0.1:6006:6006"   # UI, this machine only
    volumes:
      - phoenix_data:/mnt/data

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.16.0
    container_name: cles_prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.6
    container_name: cles_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      # The CLES console embeds Grafana: allow framing and read-only anonymous viewing. This is a
      # local PoC: the port is bound to this machine only; editing still needs the admin login.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Serve the fine-tuned model (needs an NVIDIA GPU and the NVIDIA container toolkit):
  # Set BASE_MODEL (default Qwen/Qwen3-8B, must equal the base the adapter was trained from) and
  # ADAPTER_DIR (the run folder that contains adapter/):
  #   BASE_MODEL=Qwen/Qwen3-8B ADAPTER_DIR=./artifacts/runs/<id> \
  #     docker compose --profile serve up -d vllm
  # OpenAI-compatible endpoint on :8000; the adapter is served under the model name "cles".
  vllm:
    profiles: ["serve"]
    image: vllm/vllm-openai:v0.33.0
    container_name: cles_vllm
    command: >
      --model ${BASE_MODEL:-Qwen/Qwen3-8B}
      --enable-lora
      --lora-modules cles=/runs/adapter
      --max-lora-rank 64
      --max-model-len ${MAX_MODEL_LEN:-12288}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${ADAPTER_DIR:-./adapter-not-set}:/runs:ro
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  neo4j_data:
  mlflow_artifacts:
  phoenix_data:
  grafana_data:
  hf_cache:
