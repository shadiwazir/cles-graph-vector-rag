# Receives OTLP from the application and routes it: traces to Phoenix, metrics to Prometheus.
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
      grpc: {endpoint: 0.0.0.0:4317}

processors:
  batch: {}

exporters:
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 60m   # batch stages push once and exit: keep their last values visible

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/phoenix]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
